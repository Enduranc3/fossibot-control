name: iOS build

# Push to main: tests + unsigned IPA as a workflow artifact.
# Tag v*: the same, plus a GitHub Release with the IPA and a SideStore source (source.json).
# SideStore source URL: https://github.com/<owner>/<repo>/releases/latest/download/source.json

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install, test, build web
        run: |
          npm ci
          npm test
          npm run build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Versions
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: spm-cache
          key: spm-${{ hashFiles('ios/App/CapApp-SPM/Package.swift', 'plugins/**/Package.swift') }}

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath spm-cache \
            MARKETING_VERSION=${{ steps.ver.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ steps.ver.outputs.build }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log | grep -E 'error:|\*\* BUILD'

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/App.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' -c 'Print :CFBundleVersion' -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry FossibotControl.ipa Payload
          ls -l FossibotControl.ipa

      - name: SideStore source
        run: |
          node scripts/make-source.mjs FossibotControl.ipa \
            "${{ steps.ver.outputs.version }}" "${{ steps.ver.outputs.build }}" \
            "$GITHUB_REPOSITORY" "${GITHUB_REF_NAME}" > source.json
          cat source.json

      - uses: actions/upload-artifact@v7
        with:
          name: FossibotControl-${{ steps.ver.outputs.version }}
          path: |
            FossibotControl.ipa
            source.json

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log
          path: xcodebuild.log

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            FossibotControl.ipa
            source.json
          generate_release_notes: true
